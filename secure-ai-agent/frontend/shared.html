<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shared Chat — Aperture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shared-page">
    <div class="shared-brand">
      <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="#d4f1de" stroke="#2f8f5f" stroke-width="1.1" />
        <g stroke="#2f8f5f" stroke-width="1.1" stroke-linecap="round" fill="none">
          <line x1="14.31" y1="8" x2="20.05" y2="17.94" />
          <line x1="9.69" y1="8" x2="21.17" y2="8" />
          <line x1="7.38" y1="12" x2="13.12" y2="2.06" />
          <line x1="9.69" y1="16" x2="3.95" y2="6.06" />
          <line x1="14.31" y1="16" x2="2.83" y2="16" />
          <line x1="16.62" y1="12" x2="10.88" y2="21.94" />
        </g>
      </svg>
      Aperture · Shared chat
    </div>
    <h1 id="shared-title" class="shared-title">Loading…</h1>
    <div id="shared-messages" class="shared-messages"></div>
    <p id="shared-error" class="error-text"></p>
  </div>

  <script>
    const API_BASE = "http://localhost:4000/api";
    const FILE_BASE = "http://localhost:4000";
    const token = new URLSearchParams(window.location.search).get("token");

    async function loadSharedChat() {
      const errorEl = document.getElementById("shared-error");
      const titleEl = document.getElementById("shared-title");

      if (!token) {
        titleEl.textContent = "Nothing to show";
        errorEl.textContent = "No share link provided.";
        return;
      }

      const res = await fetch(`${API_BASE}/shared/${encodeURIComponent(token)}`);
      if (!res.ok) {
        titleEl.textContent = "Nothing to show";
        errorEl.textContent = "This shared chat doesn't exist or has been revoked.";
        return;
      }

      const { title, messages } = await res.json();
      titleEl.textContent = title;
      document.title = `${title} — Aperture`;

      const container = document.getElementById("shared-messages");
      messages.forEach((msg) => {
        const el = document.createElement("div");
        el.className = `message ${msg.role}`;

        const text = document.createElement("div");
        text.style.whiteSpace = "pre-wrap";
        text.textContent = msg.content;
        el.appendChild(text);

        if (msg.image_path) {
          if (/\.(png|jpe?g|webp|gif)$/i.test(msg.image_path)) {
            const img = document.createElement("img");
            img.src = msg.image_path.startsWith("http") ? msg.image_path : FILE_BASE + msg.image_path;
            el.appendChild(img);
          } else {
            const note = document.createElement("div");
            note.className = "shared-note";
            note.textContent = "📎 A generated file was attached here. It is only available in the original chat.";
            el.appendChild(note);
          }
        }

        container.appendChild(el);
      });
    }

    loadSharedChat();
  </script>
</body>
</html>
