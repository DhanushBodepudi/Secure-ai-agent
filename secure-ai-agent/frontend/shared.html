<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shared Chat — Aperture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shared-page">
    <div class="shared-brand">
      <svg class="logo-svg" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="#d4f1de" stroke="#2f8f5f" stroke-width="1.1" />
        <g stroke="#2f8f5f" stroke-width="1.1" stroke-linecap="round" fill="none">
          <line x1="14.31" y1="8" x2="20.05" y2="17.94" />
          <line x1="9.69" y1="8" x2="21.17" y2="8" />
          <line x1="7.38" y1="12" x2="13.12" y2="2.06" />
          <line x1="9.69" y1="16" x2="3.95" y2="6.06" />
          <line x1="14.31" y1="16" x2="2.83" y2="16" />
          <line x1="16.62" y1="12" x2="10.88" y2="21.94" />
        </g>
      </svg>
      Aperture · Shared chat
    </div>
    <div class="shared-privacy-notice">
      <span>🛡️ Privacy Protected: All passwords, emails, and phone numbers are automatically hidden in this shared link.</span>
    </div>
    <h1 id="shared-title" class="shared-title">Loading…</h1>
    <div id="shared-messages" class="shared-messages"></div>
    <p id="shared-error" class="error-text"></p>
  </div>

  <script>
    const IS_LOCAL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || !window.location.hostname;
    const BACKEND_BASE = IS_LOCAL
      ? (window.location.port === "4000" ? "" : "http://localhost:4000")
      : (window.location.hostname.includes("apeture.shop")
          ? "https://aperture-backend-s79c.onrender.com"
          : "");
    const API_BASE = `${BACKEND_BASE}/api`;
    const FILE_BASE = BACKEND_BASE;

    const token = new URLSearchParams(window.location.search).get("token");

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function clientRedact(text) {
      if (!text) return "";
      let r = String(text);
      r = r.replace(/\b(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z-_]{35}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,})\b/g, "[REDACTED API KEY]");
      r = r.replace(/\b(?=[A-Za-z0-9]{32,}\b)(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{32,}\b/g, "[REDACTED TOKEN]");
      r = r.replace(/\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g, "[REDACTED EMAIL]");
      r = r.replace(/(?:\+?\d{1,3}[\s.-]?)?\(?\d{2,5}\)?[\s.-]?\d{3,5}[\s.-]?\d{3,5}\b/g, (m) => {
        const digits = m.replace(/\D/g, "");
        return digits.length >= 7 && digits.length <= 15 ? "[REDACTED PHONE]" : m;
      });
      r = r.replace(/\b[6-9]\d{9}\b/g, "[REDACTED PHONE]");
      r = r.replace(/\b[2-9]\d{2}[2-9]\d{6}\b/g, "[REDACTED PHONE]");
      r = r.replace(/(["']?(?:password|passwd|pwd|passcode|pass|secret|pin|credentials?|api_?key|access_?token|auth_?token)["']?\s*[:=]\s*)(["'][^"'\r\n]+["']|\S+)/gi, (m, prefix, val) => {
        if (val.startsWith("[REDACTED")) return m;
        return `${prefix}[REDACTED PASSWORD]`;
      });
      r = r.replace(/\b((?:my|the|user's|account|current|new|temp(?:orary)?)?\s*(?:password|passcode|pwd|pass|pin)\s+(?:is|was|set to|changed to)\s+)(["'][^"'\r\n]+["']|\S+)/gi, (m, prefix, val) => {
        if (val.startsWith("[REDACTED")) return m;
        return `${prefix}[REDACTED PASSWORD]`;
      });
      return r;
    }

    function renderFormattedContent(text) {
      const sanitized = clientRedact(text);
      const escaped = escapeHtml(sanitized);
      return escaped.replace(/\[REDACTED (PASSWORD|EMAIL|PHONE|CARD NUMBER|API KEY|TOKEN)\]/g, (m, type) => {
        return `<span class="redacted-pill">🔒 [Hidden ${type.toLowerCase()}]</span>`;
      });
    }

    async function loadSharedChat() {
      const errorEl = document.getElementById("shared-error");
      const titleEl = document.getElementById("shared-title");
      const container = document.getElementById("shared-messages");

      if (!token) {
        titleEl.textContent = "Nothing to show";
        errorEl.textContent = "No share link provided.";
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/shared/${encodeURIComponent(token)}`);
        if (!res.ok) {
          titleEl.textContent = "Nothing to show";
          errorEl.textContent = "This shared chat doesn't exist or has been revoked.";
          return;
        }

        const { title, messages } = await res.json();
        titleEl.innerHTML = renderFormattedContent(title || "Shared chat");
        document.title = `${clientRedact(title || "Shared chat")} — Aperture`;

        container.innerHTML = "";
        if (!messages || messages.length === 0) {
          const empty = document.createElement("p");
          empty.style.color = "var(--text-muted)";
          empty.style.padding = "16px 0";
          empty.textContent = "This chat has no messages yet.";
          container.appendChild(empty);
          return;
        }

        messages.forEach((msg) => {
          const el = document.createElement("div");
          el.className = `message ${msg.role}`;

          const text = document.createElement("div");
          text.style.whiteSpace = "pre-wrap";
          text.style.lineHeight = "1.6";
          text.innerHTML = renderFormattedContent(msg.content);
          el.appendChild(text);

          if (msg.image_path) {
            if (/\.(png|jpe?g|webp|gif)$/i.test(msg.image_path)) {
              const img = document.createElement("img");
              img.src = msg.image_path.startsWith("http") ? msg.image_path : FILE_BASE + msg.image_path;
              el.appendChild(img);
            } else {
              const note = document.createElement("div");
              note.className = "shared-note";
              note.textContent = "📎 A generated file was attached here. It is only available in the original chat.";
              el.appendChild(note);
            }
          }

          container.appendChild(el);
        });
      } catch (err) {
        titleEl.textContent = "Connection error";
        errorEl.textContent = "Could not reach the server to load this shared chat: " + err.message;
      }
    }

    loadSharedChat();
  </script>
</body>
</html>
